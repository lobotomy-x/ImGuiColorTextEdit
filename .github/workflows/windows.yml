name: Windows

on: [push]

jobs:
  verify-windows:
    runs-on: windows-2025

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Configure
      # let CMake auto-detect the Visual Studio version installed on the runner
      # (the windows-2025 image no longer provides Visual Studio 17 2022)
      run: cmake -B build -A x64 -S example

    - name: Build
      run: cmake --build build --config Release
